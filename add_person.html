<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Person</title>

     <!--Bootstap CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>
<body style=" background-repeat: repeat;
background-image: url('Background_image.jpg');">

    <div class="container mt-5">
    
        <h1 class="text-center"> Add a Person </h1>

        <!-- Form -->
         <form method="POST">
            <div class="mb-3">

                <label for="name" class="form-label fw-bold"> Name </label>
                <!-- id connects the input to the lable, name is used to connect HTML to flask -->
                <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <!-- Buttons -->
            <button type="submit" class="btn btn-primary">Add person</button>

            <a href="index.html" class="btn btn-secondary">Back to Chore Manager</a>

         </form>
      

    </div>
    
</body>
</html>
